[package]
name = "subscription-manager"
version = "0.1.0"
description = "Solana port of contracts/SubscriptionManager.sol — pull-payment subscription billing via SPL Token delegate authority"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "subscription_manager"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
init-if-needed = ["anchor-lang/init-if-needed"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
# token_2022 is enabled only because anchor-spl's idl-build codepath
# unconditionally references its token_interface module — the program
# itself only ever uses classic anchor_spl::token types (see the plan doc:
# Token-2022's TransferFee extension would silently corrupt the fixed-price
# accounting this program relies on, so it's a deliberate non-goal).
anchor-spl = { version = "1.1.2", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-address = "2.7.0"
solana-clock = "3.2.0"
spl-associated-token-account-client = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
